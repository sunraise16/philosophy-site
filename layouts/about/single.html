<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background: #fafafa;
      color: #222;
      line-height: 1.8;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 2rem;
      text-align: center;
      border-bottom: 2px solid #333;
      padding-bottom: 1rem;
    }
    h2 {
      font-size: 1.4rem;
      margin-top: 2.5rem;
      color: #444;
    }
    p {
      font-size: 1.1rem;
    }
    a {
      color: #333;
    }
    nav {
      background: #222;
      padding: 1rem;
      text-align: center;
    }
    nav a {
      color: #fff;
      margin: 0 1rem;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <nav>
    <a href="/">Home</a>
    <a href="/about/">About</a>
    <a href="/reading-notes/">Reading Notes</a>
    <a href="/concept-development/">Concept Development</a>
    <a href="/article/">Article</a>
  </nav>

  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </div>

</body>
</html>
